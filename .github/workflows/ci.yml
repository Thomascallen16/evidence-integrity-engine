name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow does not use dependency caching.
# Explicitly deny Actions cache access to prevent accidental cache use/poisoning.
cache-mode: none

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run proof-lab:build
