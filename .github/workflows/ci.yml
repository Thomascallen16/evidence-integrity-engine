name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow does not use dependency caching.
# Explicitly deny Actions cache access to prevent accidental cache use/poisoning.
cache-mode: none

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run proof-lab:build
